spring.application.name=url-shortener-sb

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortner}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Must be Base64 (jjwt Decoders.BASE64) and decode to >= 256 bits
jwt.secret=${JWT_SECRET:dXJsU2hvcnRuZXItbG9jYWwtand0LXNlY3JldC1rZXktMzJiIQ==}
jwt.expiration=172800000

logging.level.org.springframework.security=INFO
logging.level.com.url.shortener=DEBUG
logging.level.org.springframework.web=INFO

frontend.url=${FRONTEND_URL:http://localhost:5173}
