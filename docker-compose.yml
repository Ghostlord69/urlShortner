services:
  db:
    image: postgres:16-alpine
    container_name: urlshortner-db
    environment:
      POSTGRES_DB: urlshortner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - urlshortner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  urlshortner_pgdata:
